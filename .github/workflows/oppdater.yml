# Henter nye saker fra Stortinget og nyheter fra departementene hver morgen,
# logger hva som er nytt (data.json -> "nytt") og lagrer resultatet i repoet.
# Nettsiden henter data/data.json herfra hver time.
name: Oppdater data

on:
  schedule:
    - cron: '17 4 * * *'   # hver dag, ca. kl. 06.17 norsk sommertid (05.17 vintertid)
  workflow_dispatch:       # kan også kjøres for hånd fra Actions-fanen

permissions:
  contents: write

concurrency:
  group: oppdater-data
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hent nye data
        run: node update.mjs
      - name: Lagre endringer
        run: |
          git config user.name "innsyn-oppdatering"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "Ingen endringer i dag."
            exit 0
          fi
          NYTT=$(node -e "const d=require('./data/data.json');console.log((d.status&&d.status.newEvents)||0)")
          git commit -m "Data $(date -u +%F): $NYTT nye hendelser"
          git push
