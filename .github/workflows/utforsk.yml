# Utforsker kilder for Tema-sidene (SSB-tabeller, voteringer i Stortinget, lenker og hjelpetelefoner).
# Kjøres bare for hånd. Resultatet lagres i data/utforsk.json.
name: Utforsk kilder

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oppdater-data
  cancel-in-progress: false

jobs:
  utforsk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/utforsk.mjs
      - name: Lagre resultatet
        run: |
          git config user.name "innsyn-oppdatering"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/utforsk.json
          git diff --cached --quiet && exit 0
          git commit -m "Utforsk kilder $(date -u +%F)"
          git pull --rebase
          git push
